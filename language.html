<!DOCTYPE html>
<html>
<head>
  <title>Select Language - AquaSaver</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #b3e5fc;
      padding-top: 100px;
    }
    button {
      background-color: #03a9f4;
      color: white;
      border: none;
      padding: 15px 30px;
      margin: 20px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0288d1;
    }
  </style>
</head>
<body>
  <h2>Choose Your Language / మీ భాషను ఎంచుకోండి</h2>
  <button onclick="setLanguage('en')">English</button>
  <button onclick="setLanguage('te')">Telugu</button>
  <button onclick="setLanguage('hi')">Hindi</button>

  <script>
    function setLanguage(lang) {
      // Save user choice in browser
      localStorage.setItem('selectedLanguage', lang);

      // Go to login page
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
