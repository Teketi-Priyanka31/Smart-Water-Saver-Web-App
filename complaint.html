<!DOCTYPE html>
<html>
<head>
  <title>Submit a Complaint</title>
  <style>
    body {
      background-color: #b3e5fc;
      font-family: Arial, sans-serif;
    }
    .container {
      background-color: white;
      padding: 30px;
      width: 400px;
      margin: 100px auto;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      margin-bottom: 25px;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #03a9f4;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0288d1;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Submit a Complaint</h2>
  <form id="complaintForm" onsubmit="handleSubmit(event)">
    <input type="text" name="name" placeholder="Enter Your Name" required>
    <input type="email" name="email" placeholder="Enter Your Email" required>
    <input type="text" name="subject" placeholder="Complaint Subject" required>
    <textarea name="message" rows="5" placeholder="Describe your issue" required></textarea>
    <button type="submit">Submit Complaint</button>
  </form>
</div>

<script>
  function handleSubmit(event) {
    event.preventDefault();
    // Optionally: Add logic to store or send complaint

    // Redirect to dashboard
    window.location.href = "questions.html";
  }
</script>

</body>
</html>
